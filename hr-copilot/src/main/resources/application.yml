spring:
  application:
    name: hr-copilot
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            dimensions: 1536
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      file: compose.yaml
  datasource:
    url: jdbc:postgresql://localhost:5432/hr_copilot
    username: hr_copilot
    password: hr_copilot
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# Token usage pricing (per 1M tokens) â€” config, not code (Â§8)
pricing:
  models:
    gemini-3.5-flash-lite:
      prompt: 0.30
      completion: 2.50
    gemini-embedding-001:
      prompt: 0.00
      completion: 0.00

# Actuator (Â§8)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Server
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-http-form-post-size: 20MB

logging:
  pattern:
    level: "%5p [run=%X{runId}]"
  level:
    org.hrcopilot: DEBUG
    org.springframework.ai: INFO

app:
  corpus-path: ./corpus
  jwt-secret: ${APP_JWT_SECRET:local-development-secret-change-before-deploy-123456}
  screening:
    match-threshold-percent: ${SCREENING_MATCH_THRESHOLD_PERCENT:70}
  seed:
    recruiter-password: ${APP_SEED_RECRUITER_PASSWORD:RecruiterDemo!23}
    reviewer-password: ${APP_SEED_REVIEWER_PASSWORD:ReviewerDemo!23}
